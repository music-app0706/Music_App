name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      # --block-network: tests must replay recorded responses and never call
      # live APIs. A test without a recording fails here instead of silently
      # hitting MusicBrainz or ListenBrainz.
      - name: Run tests
        run: pytest -q --block-network
