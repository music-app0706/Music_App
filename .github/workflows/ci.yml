# Runs the server tests on every pull request and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# CI can read the code but can't change anything in the repo.
permissions:
  contents: read

# If you push again while tests are still running, stop the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server

    steps:
      # Download the code.
      - uses: actions/checkout@v5

      # Install Python 3.14, and reuse packages downloaded on earlier runs.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: server/pyproject.toml

      # Install the app plus the testing tools.
      - name: Install
        run: pip install -e ".[dev]"

      # Fail any test that tries to use the internet. Tests should use the
      # saved responses in tests/cassettes instead.
      - name: Run tests
        run: pytest -q --block-network
