# Local development: the API and Postgres 16.
#   docker compose up --build     start everything
#   docker compose down           stop (data is kept)
#   docker compose down -v        stop and delete the database
#
# Postgres settings can be changed in a .env file next to this one
# (POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, POSTGRES_PORT).
# API keys go in server/.env, which the app reads directly.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-music}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-music}
      POSTGRES_DB: ${POSTGRES_DB:-music_app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./server
    env_file:
      - path: ./server/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-music}:${POSTGRES_PASSWORD:-music}@db:5432/${POSTGRES_DB:-music_app}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Reload on code changes: mount the local source over the installed copy.
    volumes:
      - ./server/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  pgdata:
